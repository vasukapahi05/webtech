<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admission Form | GCET Jammu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <img src="images/logo.svg" alt="College Logo" class="logo">
      <div class="college-name">
        <h1>Govt. College of Engineering and Technology, Jammu</h1>
        <p>(Autonomous College)</p>
      </div>
    </div>
  </header>

  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="faculty.html">Faculty</a></li>
      <li><a href="students.html">Students</a></li>
      <li><a href="gallery.html">Photo Gallery</a></li>
      <li><a href="admission.html" class="active">Admission Form</a></li>
    </ul>
  </nav>

  <section class="section container">
    <h2>Student Admission Form</h2>
    <div class="underline"></div>

    <div class="form-wrap">
      <form action="#" method="post">
        <div class="form-grid">

          <div class="form-group">
            <label for="fullname">Full Name *</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required>
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth *</label>
            <input type="date" id="dob" name="dob" required>
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="course">Course Applied For *</label>
            <select id="course" name="course" required>
              <option value="">-- Select Course --</option>
              <option value="cse">Computer Science &amp; Engineering</option>
              <option value="ece">Electronics &amp; Communication</option>
              <option value="me">Mechanical Engineering</option>
              <option value="ce">Civil Engineering</option>
              <option value="ee">Electrical Engineering</option>
            </select>
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number *</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" pattern="[0-9]{10}" required>
          </div>

          <div class="form-group">
            <label>Gender *</label>
            <div class="radio-group">
              <label><input type="radio" name="gender" value="male" required> Male</label>
              <label><input type="radio" name="gender" value="female"> Female</label>
              <label><input type="radio" name="gender" value="other"> Other</label>
            </div>
          </div>

          <div class="form-group full-width">
            <label>Hobbies</label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
              <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
              <label><input type="checkbox" name="hobbies" value="music"> Music</label>
              <label><input type="checkbox" name="hobbies" value="coding"> Coding</label>
              <label><input type="checkbox" name="hobbies" value="art"> Art</label>
            </div>
          </div>

          <div class="form-group full-width">
            <label for="address">Address *</label>
            <textarea id="address" name="address" rows="4" placeholder="Enter your address" required></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-submit">Submit</button>
            <button type="reset" class="btn-reset">Reset</button>
          </div>

        </div>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <p>&copy; Made by Vasu | College Project</p>
  </footer>

</body>
</html>
