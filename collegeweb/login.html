<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | GCET Jammu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <img src="images/logo.svg" alt="College Logo" class="logo">
      <div class="college-name">
        <h1>Govt. College of Engineering and Technology, Jammu</h1>
        <p>(Autonomous College)</p>
      </div>
    </div>
  </header>

  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="faculty.html">Faculty</a></li>
      <li><a href="students.html">Students</a></li>
      <li><a href="gallery.html">Photo Gallery</a></li>
      <li><a href="admission.html">Admission Form</a></li>
    </ul>
  </nav>

  <section class="section container">
    <h2>Student Login</h2>
    <div class="underline"></div>

    <div class="form-wrap login-wrap">
      <form action="result.html" method="get">
        <div class="form-group">
          <label for="roll">Student Login (Roll No.) *</label>
          <input type="text" id="roll" name="roll" placeholder="Enter your Roll No." autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-submit">Login</button>
          <a href="index.html" class="btn-reset">Back to Home</a>
        </div>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <p>&copy; Made by Vasu | College Project</p>
  </footer>
</body>
</html>
