<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery | GCET Jammu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <img src="images/logo.svg" alt="College Logo" class="logo">
      <div class="college-name">
        <h1>Govt. College of Engineering and Technology, Jammu</h1>
        <p>(Autonomous College)</p>
      </div>
    </div>
  </header>

  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="faculty.html">Faculty</a></li>
      <li><a href="students.html">Students</a></li>
      <li><a href="gallery.html" class="active">Photo Gallery</a></li>
      <li><a href="admission.html">Admission Form</a></li>
    </ul>
  </nav>

  <section class="section container">
    <h2>Photo Gallery</h2>
    <div class="underline"></div>

    <div class="gallery-grid">
      <figure class="gallery-item">
        <img src="images/college.jpg" alt="College Building at GCET Jammu">
        <figcaption>College Building</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/library.jpg" alt="Library at GCET Jammu">
        <figcaption>Library</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/ground.jpg" alt="Sports Ground at GCET Jammu">
        <figcaption>Sports Ground</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/1.jpg" alt="Seminar Hall at GCET Jammu">
        <figcaption>Seminar Hall</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/campus.jpg" alt="Campus View at GCET Jammu">
        <figcaption>Campus View</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/academic-block.jpg" alt="Academic Block at GCET Jammu">
        <figcaption>Academic Block</figcaption>
      </figure>
    </div>
  </section>

  <footer class="site-footer">
    <p>&copy; Made by Vasu | College Project</p>
  </footer>

</body>
</html>
